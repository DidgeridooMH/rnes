[package]
name = "rnes"
version = "0.1.0"
edition = "2021"

[dependencies]
sdl3 = { version = "0.16.1" }
tokio = { version = "1.28.1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
wgpu = "0.16.0"
winit = { version = "0.28.6", features = ["serde"] }
bitfield = "0.13.2"
bytemuck = { version = "1.13.1", features = ["derive"] }
clap = { version = "4.3.0", features = ["derive"] }
gilrs = "0.10.2"
rfd = "0.17.2"
rwh05 = { version = "0.5", package = "raw-window-handle" }
rwh06 = { version = "0.6", package = "raw-window-handle" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
softbuffer = "0.3"
font8x8 = "0.3.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = "0.21.2"
