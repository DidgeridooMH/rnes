name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Headers SDL3 needs when it is built from source on Linux (audio backends
  # are loaded at runtime, so these are build-time only), plus libudev for
  # gamepad support.
  LINUX_DEPS: >-
    cmake ninja-build pkg-config libudev-dev libdbus-1-dev
    libasound2-dev libpulse-dev libpipewire-0.3-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev
    libxfixes-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: friendlyanon/setup-vcpkg@v1
        with: { committish: 63aa65e65b9d2c08772ea15d25fb8fdb0d32e557 }

      - name: Install SDL3
        run: vcpkg install

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target\release\rnes.exe release\
          Copy-Item vcpkg_installed\x64-windows\bin\SDL3.dll release\
          Compress-Archive -Path release\* -DestinationPath rnes-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rnes-windows-x64
          path: rnes-windows-x64.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --release

      - name: Show linked libraries
        run: ldd target/release/rnes

      - name: Package tarball
        run: |
          mkdir -p rnes-linux-x64
          cp target/release/rnes README.md rnes-linux-x64/
          tar -czf rnes-linux-x64.tar.gz rnes-linux-x64

      - name: Package .deb
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          PKG=debian-pkg
          mkdir -p $PKG/DEBIAN $PKG/usr/bin $PKG/usr/share/doc/rnes
          install -m 755 target/release/rnes $PKG/usr/bin/rnes
          cp README.md $PKG/usr/share/doc/rnes/
          cat > $PKG/DEBIAN/control <<EOF
          Package: rnes
          Version: $VERSION
          Section: games
          Priority: optional
          Architecture: amd64
          Depends: libc6, libudev1
          Recommends: libvulkan1 | libgl1
          Maintainer: DidgeridooMH
          Description: NES emulator written in Rust
           A Nintendo Entertainment System emulator. SDL3 is built in.
          EOF
          dpkg-deb --root-owner-group --build $PKG rnes_${VERSION}_amd64.deb
          echo "DEB_FILE=rnes_${VERSION}_amd64.deb" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: rnes-linux-x64
          path: |
            rnes-linux-x64.tar.gz
            ${{ env.DEB_FILE }}

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --release

      - name: Show linked libraries
        run: otool -L target/release/rnes

      - name: Package
        run: |
          mkdir -p release
          cp target/release/rnes release/
          cd release && zip -r ../rnes-macos-arm64.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: rnes-macos-arm64
          path: rnes-macos-arm64.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rnes-windows-x64/*.zip
            artifacts/rnes-linux-x64/*.tar.gz
            artifacts/rnes-linux-x64/*.deb
            artifacts/rnes-macos-arm64/*.zip
          fail_on_unmatched_files: true
